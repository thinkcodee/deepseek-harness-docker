name: Build & Push (Docker Hub)

# 目标：把 DSH 的 Dockerfile 打成多架构镜像，**同时**发布到 Docker Hub 与 GHCR（tag 完全一致）。
# GHCR 是备用源：Docker Hub 在国内/NAS 拉不动时切 ghcr.io/<owner>/deepseek-harness:<tag>。
# 注意：GHCR 包首次推送后默认 private，需在 GitHub → Packages 里把可见性改成 Public 才能免登录拉取。
# 构建成功后还会打 git tag（dsh-v<版本>）并发布 GitHub Release，附源码 tar.gz/zip 与 SHA256。
# 关键点：先把 DSH_VERSION 解析成具体版本号（auto 取 npm next）再构建，
# 让每个镜像的 DSH 版本可复现、可追溯，而不是「构建那一刻的 next」。
on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '要打包的 DSH 版本：具体版本号（如 0.2.2-rc.2）或 npm 标签（next/latest），auto = next'
        required: false
        default: 'auto'
      platforms:
        description: '目标架构（多架构用逗号分隔；arm/v7 为尽力支持，Node 官方镜像与 uv 对 32 位 ARM 支持不稳）'
        required: false
        type: choice
        default: 'linux/amd64,linux/arm64'
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm64,linux/arm/v7'
      update_maintenance:
        description: '构建成功后回填 MAINTENANCE.md 版本记录'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.build-variants'
      - 'entrypoint.sh'
      - 'proxy/**'
      - 'manager/**'
      - '.github/workflows/build-push-dockerhub.yml'
  schedule:
    # 每天 01:00 UTC = 09:00 Asia/Shanghai，自动跟随官方版本重打
    - cron: '0 1 * * *'

permissions:
  contents: write   # 建 tag / Release
  packages: write   # 推 ghcr.io

concurrency:
  group: build-push-dockerhub-${{ github.ref }}
  cancel-in-progress: false

env:
  # Docker Hub 镜像名，形如 <namespace>/<repo>；未配置变量时用仓库 owner + deepseek-harness
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/deepseek-harness', github.repository_owner) }}
  # GHCR 镜像名，与 Docker Hub 对齐（同 owner、同仓库名）；GHCR 要求全小写
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/deepseek-harness

jobs:
  resolve:
    name: 解析版本与变体
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      variants: ${{ steps.matrix.outputs.variants }}
      platforms: ${{ steps.ver.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Docker Hub 配置
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$U" ] && missing="$missing DOCKERHUB_USERNAME(secret)"
          [ -z "$T" ] && missing="$missing DOCKERHUB_TOKEN(secret)"
          if [ -n "$missing" ]; then
            echo "::error::缺少配置:$missing。请在 Settings → Secrets and variables → Actions 添加（Token 到 Docker Hub → Account settings → Personal access tokens 生成，权限 Read & Write）"
            exit 1
          fi
          echo "目标镜像：$IMAGE"

      - name: 解析 DSH 版本（钉成具体版本号）
        id: ver
        env:
          RAW: ${{ github.event.inputs.dsh_version || 'auto' }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          set -euo pipefail
          raw="$(echo "$RAW" | tr -d '[:space:]')"
          if [[ "$raw" =~ ^[0-9] ]]; then
            ver="$raw"; echo "按具体版本处理：$ver"
          else
            tag="$raw"; [ "$tag" = "auto" ] && tag="next"
            ver="$(curl -fsSL "https://registry.npmjs.org/@deepseek-ai/dsh/$tag" \
                   | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.version){console.error("npm 标签 %s 没有 version 字段",process.argv[1]);process.exit(1)}process.stdout.write(j.version)})' "$tag")" \
              || { echo "::error::无法从 npm 解析标签 $tag"; exit 1; }
            echo "npm 标签 $tag → $ver"
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@deepseek-ai/dsh/$ver")"
          if [ "$code" != "200" ]; then
            echo "::error::DSH 版本不存在：$ver（npm 返回 $code）"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "✅ 将构建 DSH $ver（$PLATFORMS）"

      - name: 生成变体矩阵
        id: matrix
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(".build-variants", "utf8")
              .split("\n").map(l => l.trim())
              .filter(l => l && !l.startsWith("#"));
            const prefixes = lines.map(l => l.split("|")[0].trim()).filter(Boolean);
            const variants = ["none", ...prefixes.filter(p => p !== "none")];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `variants=${JSON.stringify(variants)}\n`);
            console.log("构建变体：", variants.join(", "));
          '

  build:
    name: 构建 ${{ matrix.variant }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: tags
        env:
          V: ${{ needs.resolve.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          short="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          # GHCR 的包路径必须全小写
          ghcr="$(printf '%s' "${{ env.GHCR_IMAGE }}" | tr '[:upper:]' '[:lower:]')"
          if [ "$VARIANT" = "none" ]; then
            tags="${{ env.IMAGE }}:$V
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:sha-$short
          $ghcr:$V
          $ghcr:latest
          $ghcr:sha-$short"
          else
            tags="${{ env.IMAGE }}:${VARIANT}-$V
          ${{ env.IMAGE }}:${VARIANT}-latest
          ${{ env.IMAGE }}:${VARIANT}-sha-$short
          $ghcr:${VARIANT}-$V
          $ghcr:${VARIANT}-latest
          $ghcr:${VARIANT}-sha-$short"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ needs.resolve.outputs.platforms }}
          push: true
          build-args: |
            DEV_TOOLS=${{ matrix.variant }}
            DSH_VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          # Docker Hub 不保留 attestation manifest，关掉避免 pull 端不兼容
          provenance: false
          sbom: false

  verify:
    name: 校验镜像内版本
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 回拉并比对版本与架构（Docker Hub + GHCR）
        env:
          V: ${{ needs.resolve.outputs.version }}
          EXPECTED: ${{ needs.resolve.outputs.platforms }}
        run: |
          set -euo pipefail
          ghcr="$(printf '%s' "${{ env.GHCR_IMAGE }}" | tr '[:upper:]' '[:lower:]')"
          for img in "${{ env.IMAGE }}:$V" "$ghcr:$V"; do
            echo "===== $img ====="
            docker pull "$img"
            actual="$(docker run --rm --entrypoint cat "$img" /tmp/app_version.env | sed -n 's/^APP_VERSION=//p')"
            echo "版本 期望 $V / 实际 $actual"
            if [ "$actual" != "$V" ]; then
              echo "::error::镜像内版本 $actual 与目标 $V 不一致（$img）"
              exit 1
            fi
            got="$(docker buildx imagetools inspect "$img" | sed -n 's/^  Platform: *//p' | sort -u | tr '\n' ' ')"
            echo "架构 期望 [$EXPECTED] / 实际 [$got]"
            for p in $(printf '%s' "$EXPECTED" | tr ',' ' '); do
              case " $got " in
                *" $p "*) ;;
                *) echo "::error::$img 缺少架构 $p（实际：$got）"; exit 1 ;;
              esac
            done
          done
          echo "✅ 版本与架构校验通过（Docker Hub + GHCR）"

  record:
    name: 回填版本记录
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    # push 触发时不回填，避免自动提交造成循环
    if: github.event_name != 'push' && inputs.update_maintenance != false
    steps:
      - uses: actions/checkout@v4

      - name: 更新 MAINTENANCE.md
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          today="$(date -u -d '+8 hours' +%F)"
          next="$(curl -fsSL https://registry.npmjs.org/@deepseek-ai/dsh/next | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" || next="未知"
          latest="$(curl -fsSL https://registry.npmjs.org/@deepseek-ai/dsh/latest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" || latest="未知"
          sed -i -E "s#^\| 已核对版本 \|.*#| 已核对版本 | $V（$today CI 构建） |#" MAINTENANCE.md
          sed -i -E "s#^\| npm 标签 \|.*#| npm 标签 | \`next\` = $next，\`latest\` = $latest |#" MAINTENANCE.md
          git diff --stat

      - name: 提交
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAINTENANCE.md
          git commit -m "chore: CI 已发布 $V，回填已核对版本 [skip ci]"
          git push

  release:
    name: 打 tag 并发布源码
    needs: [resolve, verify, record]
    # record 被跳过（push 触发）时仍要发布；verify 失败则不发布
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 检查 tag 是否已存在
        id: chk
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="dsh-v$V"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已存在 $tag，跳过创建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "将创建 $tag"
          fi

      - name: 生成源码制品包
        if: steps.chk.outputs.exists == 'false'
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="deepseek-harness-docker-$V/"
          git archive --format=tar.gz --prefix="$prefix" -o "dist/deepseek-harness-docker-$V.tar.gz" HEAD
          git archive --format=zip    --prefix="$prefix" -o "dist/deepseek-harness-docker-$V.zip" HEAD
          ( cd dist && sha256sum "deepseek-harness-docker-$V.tar.gz" "deepseek-harness-docker-$V.zip" > "deepseek-harness-docker-$V.sha256" )
          ls -lh dist/

      - name: 推送 tag
        if: steps.chk.outputs.exists == 'false'
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "dsh-v$V" -m "DSH $V Docker 镜像源码快照"
          git push origin "dsh-v$V"

      - name: 创建 GitHub Release
        if: steps.chk.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dsh-v${{ needs.resolve.outputs.version }}
          name: DSH ${{ needs.resolve.outputs.version }} Docker 镜像源码
          body: |
            ## DSH ${{ needs.resolve.outputs.version }} Docker 镜像

            对应一次成功的镜像构建，同时推送到 Docker Hub 与 GitHub Container Registry。

            **架构**：`${{ needs.resolve.outputs.platforms }}`（buildx 多架构 manifest，docker pull 时按宿主自动选择）

            ### 镜像地址（tag 完全一致，二选一）

            - Docker Hub：`${{ env.IMAGE }}`
            - GHCR 备用（Docker Hub 拉不动时用）：`${{ env.GHCR_IMAGE }}`

            | 用途 | 标签 |
            |---|---|
            | 推荐：含 git/curl/vim/pnpm/uv | `:devtools-${{ needs.resolve.outputs.version }}`、`:devtools-latest` |
            | 精简工具链 | `:devtools-min-${{ needs.resolve.outputs.version }}`、`:devtools-min-latest` |
            | 管理台变体 | `:admin-${{ needs.resolve.outputs.version }}`、`:admin-latest` |
            | 最小体积（无额外工具） | `:${{ needs.resolve.outputs.version }}`、`:latest` |

            ```bash
            docker pull ${{ env.IMAGE }}:devtools-latest
            # 或
            docker pull ${{ env.GHCR_IMAGE }}:devtools-latest
            ```

            ### 源码制品
            - `deepseek-harness-docker-${{ needs.resolve.outputs.version }}.tar.gz` / `.zip`：提交 `${{ github.sha }}` 的完整源码快照
            - `deepseek-harness-docker-${{ needs.resolve.outputs.version }}.sha256`：上面两个包的校验和
            - GitHub 自动附带的 Source code (zip / tar.gz)

            ### 版本对应
            DSH `${{ needs.resolve.outputs.version }}`（npm `next`/指定版本），镜像内 `/tmp/app_version.env` 的 `APP_VERSION` 已由 CI 回拉校验。
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
