name: Build & Push (Harbor)

# 构建全部镜像变体（基础镜像 + .build-variants 中每个前缀各一个），推送到 Harbor。
# 版本锚点：DSH_VERSION 解析成具体的 @deepseek-ai/dsh 版本号后再打 tag，
# 镜像 tag 因此可复现，不会出现「镜像里是哪个 DSH 版本说不清」的问题。
#
# 需要先配置（仓库 Settings → Secrets and variables → Actions）：
#   Variables: HARBOR_REGISTRY（必填，如 harbor.example.com）
#              HARBOR_PROJECT （选填，默认 dsh）
#              HARBOR_IMAGE   （选填，默认 deepseek-harness）
#   Secrets:   HARBOR_USERNAME / HARBOR_PASSWORD（Harbor 机器人账号或普通账号）

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH 版本：auto(=npm next) / 具体版本号，如 0.2.2-rc.2'
        type: string
        default: auto
      platforms:
        description: '目标架构'
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      update_maintenance:
        description: '构建成功后回填 MAINTENANCE.md 的已核对版本'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.build-variants'
      - 'entrypoint.sh'
      - 'proxy/**'
      - 'manager/**'
      - '.github/workflows/build-push-harbor.yml'
  schedule:
    # 每天 01:00 UTC = 09:00 Asia/Shanghai，跟随官方发版自动重打
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: build-push-harbor-${{ github.ref }}
  cancel-in-progress: false

env:
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'dsh' }}
  HARBOR_IMAGE: ${{ vars.HARBOR_IMAGE || 'deepseek-harness' }}
  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

jobs:
  # ── 1. 解析版本、生成变体矩阵 ─────────────────────────────────────
  resolve:
    name: Resolve version & variants
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Harbor 配置
        run: |
          missing=""
          [ -z "$HARBOR_REGISTRY" ] && missing="$missing HARBOR_REGISTRY(vars)"
          [ -z "$HARBOR_USERNAME" ] && missing="$missing HARBOR_USERNAME(secret)"
          [ -z "$HARBOR_PASSWORD" ] && missing="$missing HARBOR_PASSWORD(secret)"
          if [ -n "$missing" ]; then
            echo "::error::缺少配置:$missing"
            exit 1
          fi
          echo "镜像目标：${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_IMAGE}"

      - name: 解析 DSH 版本
        id: ver
        run: |
          set -euo pipefail
          want='${{ inputs.dsh_version }}'
          [ -z "$want" ] && want=auto

          # 版本号（以数字开头）直接用；否则视为 npm dist-tag（auto→next）
          case "$want" in
            auto) tag=next ;;
            [0-9]*) tag="" ;;
            *) tag="$want" ;;
          esac

          if [ -n "$tag" ]; then
            resolved=$(curl -fsSL "https://registry.npmjs.org/@deepseek-ai/dsh/$tag" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.version){console.error("no version in registry response");process.exit(1)}console.log(j.version)})')
          else
            resolved="$want"
          fi

          # 校验该版本真实存在，避免把不存在的版本打进构建
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@deepseek-ai/dsh/$resolved")
          if [ "$code" != "200" ]; then
            echo "::error::@deepseek-ai/dsh@$resolved 在 npm 上不存在（HTTP $code）"
            exit 1
          fi

          echo "version=$resolved" >> "$GITHUB_OUTPUT"
          echo "解析结果：DSH_VERSION=$resolved"

      - name: 生成变体矩阵
        id: matrix
        run: |
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(".build-variants", "utf8").split("\n")
              .map(l => l.trim())
              .filter(l => l && !l.startsWith("#"));
            const prefixes = lines.map(l => l.split("|")[0].trim()).filter(Boolean);
            const variants = ["none", ...prefixes.filter(p => p !== "none")];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `variants=${JSON.stringify(variants)}\n`);
            console.log("变体：", variants.join(", "));
          '

  # ── 2. 逐变体构建并推送 ───────────────────────────────────────────
  build:
    name: build ${{ matrix.variant }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像 tag
        id: tags
        run: |
          set -euo pipefail
          img="$HARBOR_REGISTRY/$HARBOR_PROJECT/$HARBOR_IMAGE"
          v='${{ needs.resolve.outputs.version }}'
          short=$(git rev-parse --short HEAD)
          if [ '${{ matrix.variant }}' = "none" ]; then
            tags="$img:$v"$'\n'"$img:latest"$'\n'"$img:sha-$short"
          else
            tags="$img:${{ matrix.variant }}-$v"$'\n'"$img:${{ matrix.variant }}-latest"$'\n'"$img:${{ matrix.variant }}-sha-$short"
          fi
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$img" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: 构建并推送 ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DEV_TOOLS=${{ matrix.variant }}
            DSH_VERSION=${{ needs.resolve.outputs.version }}
          # Harbor 未必支持 attestation manifest，显式关闭以免后续 pull 失败
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # ── 3. 回拉镜像验证版本真的写进去了 ───────────────────────────────
  verify:
    name: verify base image
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: 校验镜像内 DSH 版本
        run: |
          set -euo pipefail
          img="$HARBOR_REGISTRY/$HARBOR_PROJECT/$HARBOR_IMAGE"
          want='${{ needs.resolve.outputs.version }}'
          docker pull "$img:$want"
          got=$(docker run --rm --entrypoint cat "$img:$want" /tmp/app_version.env | sed 's/^APP_VERSION=//')
          echo "期望：$want / 实际：$got"
          if [ "$got" != "$want" ]; then
            echo "::error::镜像内版本($got)与目标版本($want)不一致"
            exit 1
          fi

  # ── 4. 回填 MAINTENANCE.md（仅定时/手动触发时，避免 push 循环）────
  record:
    name: record version
    needs: [resolve, verify]
    if: github.event_name != 'push' && inputs.update_maintenance != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新版本记录并提交
        run: |
          set -euo pipefail
          v='${{ needs.resolve.outputs.version }}'
          today=$(date -u -d '+8 hours' +%F)
          latest=$(curl -fsSL https://registry.npmjs.org/@deepseek-ai/dsh/latest \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')

          sed -i -E "s#^\| 已核对版本 \|.*#| 已核对版本 | ${v}（${today} 核对，CI 构建） |#" MAINTENANCE.md
          sed -i -E "s#^\| npm 标签 \|.*#| npm 标签 | \`next\` = ${v}，\`latest\` = ${latest} |#" MAINTENANCE.md

          if git diff --quiet MAINTENANCE.md; then
            echo "版本记录无变化，跳过提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAINTENANCE.md
          git commit -m "chore: CI 已发布 ${v}，回填已核对版本 [skip ci]"
          git push
